apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Elloumi-A/azure-terraform-gitops-platform.git
    targetRevision: main
    path: charts/devops-platform
    helm:
      valueFiles:
        - values-ghcr.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-platform-gitops
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
